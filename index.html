<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AIO PROFESSIONAL PRODUCT'S</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff7fb;
    --bg2:#f7fff8;
    --muted:#6b7280;
    --accent1:#ff3fa8;
    --accent2:#ff8a3d;
    --card-bg:#fff;
    --price:#0f7a4a;
    --shadow:0 12px 36px rgba(6,18,30,0.08);
    --glass: rgba(255,255,255,0.6);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(120deg,var(--bg1),var(--bg2));color:#111;-webkit-font-smoothing:antialiased}
  .site{max-width:1100px;margin:0 auto;padding:18px}
  /* Premium header */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .brand{display:flex;gap:14px;align-items:center;min-width:0}
  .logo-wrap{
    width:78px;height:78px;border-radius:18px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 50px rgba(255,63,168,0.14), inset 0 -6px 20px rgba(0,0,0,0.06);
    position:relative;overflow:visible;padding:6px;
  }
  .logo-frame{
    width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,0.95);
    display:flex;align-items:center;justify-content:center;overflow:hidden;backdrop-filter: blur(6px);
    box-shadow:0 6px 30px rgba(10,20,40,0.08);
    transform:translateZ(0);
    transition:transform .35s ease;
  }
  /* FIX: show full logo (no cropping) and add breathing space */
  .logo-frame img{
    width:100%;
    height:100%;
    object-fit:contain;   /* <-- important fix preserved */
    display:block;
    padding:6px;          /* small inner padding so icon doesn't touch edges */
    background:transparent;
  }
  .logo-wrap:hover .logo-frame{transform:translateY(-4px) scale(1.02)}
  /* glow ring */
  .logo-wrap::after{
    content:"";position:absolute;inset:-8px;border-radius:22px;
    background:linear-gradient(90deg, rgba(255,63,168,0.08), rgba(255,138,61,0.06));
    filter:blur(12px);pointer-events:none;
  }
  .sitename{overflow:hidden}
  .sitename .title{font-size:18px;font-weight:900;letter-spacing:0.2px}
  .sitename .sub{font-size:13px;color:var(--muted);margin-top:4px}
  nav{display:flex;gap:12px;align-items:center}
  .btn{padding:8px 14px;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(255,63,168,0.08)}
  .btn-ghost{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.05);font-weight:700;color:#222;text-decoration:none}
  /* hero */
  .hero{margin-top:6px;padding:18px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.86));box-shadow:var(--shadow)}
  .hero h1{margin:0;font-size:20px}
  .hero p{margin:8px 0 0;color:var(--muted)}
  /* grid */
  .section-title{margin:20px 0 8px;font-size:20px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
  @media(min-width:900px){ .grid{grid-template-columns:repeat(3,1fr);gap:18px} }
  .card{background:var(--card-bg);border-radius:14px;padding:12px;box-shadow:0 12px 32px rgba(10,20,40,0.06);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:340px;transition:transform .22s,box-shadow .22s}
  .card:hover{transform:translateY(-10px);box-shadow:0 26px 60px rgba(10,20,40,0.12)}
  .badge{position:absolute;left:14px;top:14px;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;font-weight:700;font-size:12px}
  .img-wrap{width:100%;height:160px;border-radius:12px;overflow:hidden;background:#f6f6f6;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
  .card:hover .img-wrap img{transform:scale(1.04)}
  .title{font-weight:800;margin-top:12px;font-size:16px}
  .short{color:var(--muted);font-size:13px;margin-top:6px}
  .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
  .mrp{text-decoration:line-through;color:var(--muted);font-size:13px}
  .price{font-weight:900;color:var(--price);font-size:17px}
  .discount{font-weight:700;color:var(--accent1);font-size:13px}
  .how{margin-top:10px;background:#f4f6f7;padding:10px;border-radius:10px;color:#334;font-size:13px}
  .actions{display:flex;gap:10px;margin-top:auto;align-items:center}
  .order-btn{flex:1;padding:10px;border-radius:10px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:14px;display:inline-block}
  .order-small{padding:8px 10px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,0.06);font-size:13px;color:#0b4aa3;text-decoration:none}
  footer{margin:28px 0;color:var(--muted);font-size:15px;text-align:center}
  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
  #lightbox img{max-width:980px;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
  #lightboxClose{position:fixed;right:18px;top:18px;background:#fff;border-radius:999px;padding:8px 10px;cursor:pointer;font-weight:800;z-index:10000}
  /* responsive tweaks */
  @media(max-width:420px){ .img-wrap{height:140px} .title{font-size:15px} .logo-wrap{width:66px;height:66px} .logo-frame{width:52px;height:52px} }
</style>
</head>
<body>
  <!-- lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <span id="lightboxClose" onclick="closeLightbox();event.stopPropagation()">✕</span>
    <img id="lightboxImg" src="" alt="product large">
  </div>

  <div class="site">
    <header>
      <div class="brand">
        <div class="logo-wrap" title="AIO">
          <div class="logo-frame">
            <!-- logo file on GitHub: images/mylogo.png -->
            <img src="images/mylogo.png" alt="AIO logo" id="siteLogo">
          </div>
        </div>
        <div class="sitename">
          <div class="title">AIO PROFESSIONAL PRODUCT'S</div>
          <div class="sub">Premium product showcase</div>
        </div>
      </div>

      <nav>
        <!-- Shop removed as requested, only Contact -->
        <a class="btn-ghost" href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Free shipping on orders above ₹499</h1>
      <p class="muted">Bestsellers & New Arrivals — tap a product to view details or click image to zoom.</p>
    </section>

    <h3 class="section-title">Bestsellers</h3>
    <section id="products" class="grid" aria-live="polite"></section>

    <h3 class="section-title">New Arrivals</h3>
    <section id="newArrivals" class="grid" aria-live="polite"></section>

    <footer id="contact">
      Contact / Orders — WhatsApp: <strong id="contactNum">9136707577</strong> • Email: <strong id="contactEmail">shaikhsalu227@gmail.com</strong>
    </footer>
  </div>

<script>
/* lightbox functions */
function openLightbox(src){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  lb.style.display = 'flex';
}
function closeLightbox(){
  const lb = document.getElementById('lightbox');
  lb.style.display = 'none';
}

/* fetch and render products */
/* ----- FIXED: robust slicing and avoid duplicating best as newArrivals ----- */
async function loadProducts(){
  try{
    const res = await fetch('products.json?' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const prods = await res.json();
    if(!Array.isArray(prods) || prods.length === 0){
      document.getElementById('products').innerHTML = '<div style="color:#666">Products not available. Upload products.json and images folder.</div>';
      return;
    }
    // show first up to 4 as bestsellers
    const bestCount = Math.min(4, prods.length);
    const best = prods.slice(0, bestCount);
    const rest = prods.slice(bestCount); // remaining items for new arrivals
    renderGrid('products', best);
    // render newArrivals only if there are remaining items
    if(rest.length > 0){
      renderGrid('newArrivals', rest);
    } else {
      // ensure section is empty if no new arrivals
      document.getElementById('newArrivals').innerHTML = '';
    }
  }catch(e){
    console.error(e);
    document.getElementById('products').innerHTML = '<div style="color:#666">Products not available. Upload products.json and images folder.</div>';
    document.getElementById('newArrivals').innerHTML = '';
  }
}
function getDiscount(mrp, price){ if(!mrp || mrp<=price) return 0; return Math.round(((mrp-price)/mrp)*100); }

function renderGrid(targetId, arr){
  const container = document.getElementById(targetId);
  container.innerHTML = '';
  arr.forEach(p=>{
    const card = document.createElement('div'); card.className='card';
    const discount = getDiscount(p.mrp||p.price, p.price);
    const badgeText = p.badge || (discount>0? `Sale ${discount}% OFF` : 'New');
    const imagePath = p.image || 'images/placeholder.jpg';
    // escape single quotes inside path for onclick attribute
    const safePath = String(imagePath).replace(/'/g, "\\'");
    card.innerHTML = `
      <div class="badge">${badgeText}</div>
      <div class="img-wrap" onclick="openLightbox('${safePath}')"><img src="${imagePath}" alt="${escapeHtml(p.name)}"></div>
      <div class="title">${escapeHtml(p.name)}</div>
      <div class="short">${escapeHtml(p.short||'')}</div>
      <div class="price-row">
        <div>
          <div class="mrp">${p.mrp ? 'MRP: ' + (p.currency||'₹') + p.mrp : ''}</div>
          <div class="price">${p.currency||'₹'} ${p.price}</div>
        </div>
        <div class="discount">${discount>0? discount+'% off' : ''}</div>
      </div>
      <div class="how"><strong>How to use</strong><div style="margin-top:6px">${escapeHtml(p.how||'')}</div></div>
      <div class="actions">
        <a class="order-btn" href="https://wa.me/91${document.getElementById('contactNum').textContent.trim()}?text=${encodeURIComponent('I want to order: '+p.name+' | Price: '+ (p.currency||'₹')+p.price)}" target="_blank">Order</a>
        <a class="order-small" href="https://wa.me/91${document.getElementById('contactNum').textContent.trim()}?text=${encodeURIComponent('I want to order: '+p.name)}" target="_blank">Quick</a>
      </div>
    `;
    container.appendChild(card);
  });
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

/* On load */
loadProducts();
</script>
</body>
      </html>
