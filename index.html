<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AIO PROFESSIONAL PRODUCT'S</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff7fb;
    --bg2:#f7fff8;
    --muted:#6b7280;
    --accent1:#ff3fa8;
    --accent2:#ff8a3d;
    --card-bg:#fff;
    --price:#0f7a4a;
    --shadow:0 10px 30px rgba(2,6,23,0.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(120deg,var(--bg1),var(--bg2));color:#111; -webkit-font-smoothing:antialiased}
  .site{max-width:1100px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .brand{display:flex;gap:12px;align-items:center;min-width:0}
  /* logo image (use images/mylogo.png) - fallback to gradient text if image not found */
  .logo {
    width:64px;height:64px;border-radius:14px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;
    box-shadow:0 10px 30px rgba(255,63,168,0.12);
    overflow:hidden;
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}
  .sitename{overflow:hidden}
  .sitename .title{font-size:16px;font-weight:900;letter-spacing:0.3px}
  .sitename .sub{font-size:12px;color:var(--muted);margin-top:4px}
  nav{display:flex;gap:10px;align-items:center}
  .btn{padding:8px 12px;border-radius:10px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;font-weight:700;text-decoration:none}
  .btn.alt{background:transparent;color:#111;border:1px solid rgba(0,0,0,0.06)}
  /* hero */
  .hero{margin-top:8px;padding:18px;border-radius:14px;background:rgba(255,255,255,0.9);box-shadow:var(--shadow)}
  .hero h1{margin:0;font-size:20px}
  .hero p{margin:6px 0 0;color:var(--muted)}
  /* grid */
  .section-title{margin:20px 0 8px;font-size:20px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
  @media(min-width:900px){ .grid{grid-template-columns:repeat(3,1fr);gap:18px} }
  .card{background:var(--card-bg);border-radius:12px;padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:320px;transition:transform .22s,box-shadow .22s}
  .card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(10,20,40,0.12)}
  .badge{position:absolute;left:12px;top:12px;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;font-weight:700;font-size:12px}
  .img-wrap{width:100%;height:160px;border-radius:10px;overflow:hidden;background:#f6f6f6;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
  .card:hover .img-wrap img{transform:scale(1.03)}
  .title{font-weight:800;margin-top:12px;font-size:16px}
  .short{color:var(--muted);font-size:13px;margin-top:6px}
  .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
  .mrp{text-decoration:line-through;color:var(--muted);font-size:13px}
  .price{font-weight:900;color:var(--price);font-size:17px}
  .discount{font-weight:700;color:var(--accent1);font-size:13px}
  .how{margin-top:10px;background:#f4f6f7;padding:10px;border-radius:8px;color:#334;font-size:13px}
  .actions{display:flex;gap:10px;margin-top:auto;align-items:center}
  .order-btn{flex:1;padding:10px;border-radius:10px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:14px;display:inline-block}
  .order-small{padding:8px 10px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,0.06);font-size:13px;color:#0b4aa3;text-decoration:none}
  footer{margin:28px 0;color:var(--muted);font-size:15px;text-align:center}
  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
  #lightbox img{max-width:980px;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
  #lightboxClose{position:fixed;right:18px;top:18px;background:#fff;border-radius:999px;padding:8px 10px;cursor:pointer;font-weight:800;z-index:10000}
  @media(max-width:420px){ .img-wrap{height:140px} .title{font-size:15px} }
</style>
</head>
<body>
  <!-- lightbox -->
  <div id="lightbox" onclick="closeLightbox()"><span id="lightboxClose" onclick="closeLightbox();event.stopPropagation()">✕</span><img id="lightboxImg" src="" alt="product large"></div>

  <div class="site">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <!-- if images/mylogo.png exists it will show, else AIO text fallback -->
          <img id="logoImg" src="images/mylogo.png" alt="logo" onerror="this.style.display='none'; this.parentNode.classList.add('fallback')">
          <span id="logoFallback" style="display:block;color:#fff;font-weight:900">AIO</span>
        </div>
        <div class="sitename">
          <div class="title" id="siteTitle">AIO PROFESSIONAL PRODUCT'S</div>
          <div class="sub">Premium product showcase</div>
        </div>
      </div>

      <nav>
        <!-- Shop removed as requested -->
        <a class="btn alt" href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Free shipping on orders above ₹499</h1>
      <p class="muted">Bestsellers & New Arrivals — tap a product to view details or click image to zoom.</p>
    </section>

    <h3 class="section-title">Bestsellers</h3>
    <section id="products" class="grid" aria-live="polite"></section>

    <!-- newArrivals will only be shown if we have items -->
    <div id="newWrapper" style="display:none">
      <h3 class="section-title">New Arrivals</h3>
      <section id="newArrivals" class="grid" aria-live="polite"></section>
    </div>

    <footer id="contact">
      Contact / Orders — WhatsApp: <strong id="contactNum">9136707577</strong> • Email: <strong id="contactEmail">shaikhsalu227@gmail.com</strong>
    </footer>
  </div>

<script>
/* lightbox functions */
function openLightbox(src){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  lb.style.display = 'flex';
}
function closeLightbox(){
  const lb = document.getElementById('lightbox');
  lb.style.display = 'none';
}

/* fetch and render products (with no duplication) */
async function loadProducts(){
  try{
    const res = await fetch('products.json?' + Date.now());
    const prods = await res.json();
    const best = prods.slice(0,4);
    const rest = prods.slice(4);
    renderGrid('products', best);
    if(rest.length > 0){
      document.getElementById('newWrapper').style.display = '';
      renderGrid('newArrivals', rest);
    } else {
      document.getElementById('newWrapper').style.display = 'none';
    }
  }catch(e){
    console.error(e);
    document.getElementById('products').innerHTML = '<div style="color:#666">Products not available. Upload products.json and images folder.</div>';
  }
}
function getDiscount(mrp, price){ if(!mrp || mrp<=price) return 0; return Math.round(((mrp-price)/mrp)*100); }

function renderGrid(targetId, arr){
  const container = document.getElementById(targetId);
  container.innerHTML = '';
  arr.forEach(p=>{
    const card = document.createElement('div'); card.className='card';
    const discount = getDiscount(p.mrp||p.price, p.price);
    const badgeText = p.badge || (discount>0? `Sale ${discount}% OFF` : 'New');
    const imagePath = p.image || 'images/placeholder.jpg';

    // safe values
    const safeImageJSON = JSON.stringify(imagePath);
    const titleSafe = escapeHtml(p.name || '');
    const shortSafe = escapeHtml(p.short || '');
    const howSafe = escapeHtml(p.how || '');
    const priceText = (p.currency || '₹') + ' ' + (p.price || '');
    const mrpText = p.mrp ? ('MRP: ' + (p.currency || '₹') + p.mrp) : '';

    // precompute order href safely
    const contact = document.getElementById('contactNum').textContent.trim();
    const orderText = encodeURIComponent('I want to order: ' + (p.name || '') + ' | Price: ' + priceText);
    const orderHref = 'https://wa.me/91' + contact + '?text=' + orderText;

    card.innerHTML = `
      <div class="badge">${badgeText}</div>
      <div class="img-wrap" onclick="openLightbox(${safeImageJSON})"><img src="${escapeHtml(imagePath)}" alt="${titleSafe}"></div>
      <div class="title">${titleSafe}</div>
      <div class="short">${shortSafe}</div>
      <div class="price-row">
        <div>
          <div class="mrp">${mrpText}</div>
          <div class="price">${priceText}</div>
        </div>
        <div class="discount">${discount>0? discount+'% off' : ''}</div>
      </div>
      <div class="how"><strong>How to use</strong><div style="margin-top:6px">${howSafe}</div></div>
      <div class="actions">
        <a class="order-btn" href="${orderHref}" target="_blank" rel="noopener">Order</a>
        <a class="order-small" href="${orderHref}" target="_blank" rel="noopener">Quick</a>
      </div>
    `;
    container.appendChild(card);
  });
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

/* On load */
loadProducts();
</script>
</body>
</html>
